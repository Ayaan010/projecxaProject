<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IDS Dashboard{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='css/style.css') }}">
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-shield-lock-fill"></i>
        <span>IDS Monitor</span>
    </div>

    <ul class="sidebar-nav">
        <li>
            <a href="{{ url_for('dashboard.index') }}" class="{% if request.path == '/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('dashboard.alerts_page') }}" class="{% if request.path == '/alerts' %}active{% endif %}">
                <i class="bi bi-exclamation-triangle"></i><span>Alerts</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('dashboard.traffic_page') }}" class="{% if request.path == '/traffic' %}active{% endif %}">
                <i class="bi bi-graph-up"></i><span>Traffic</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('dashboard.logs_page') }}" class="{% if request.path == '/logs' %}active{% endif %}">
                <i class="bi bi-file-earmark-text"></i><span>Logs</span>
            </a>
        </li>
        <li>
            <a href="{{ url_for('dashboard.settings_page') }}" class="{% if request.path == '/settings' %}active{% endif %}">
                <i class="bi bi-gear"></i><span>Settings</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="ids-status" id="sidebarStatus">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Checking…</span>
        </div>
    </div>
</nav>

<!-- Main content -->
<div id="main-content">
    <!-- Top bar -->
    <header class="topbar">
        <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <h5 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h5>
        <div class="topbar-right">
            <span class="badge bg-secondary" id="clock"></span>
        </div>
    </header>

    <!-- Page content -->
    <main class="content-area">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Clock
    function updateClock() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Sidebar toggle (mobile)
    document.getElementById('sidebarToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('show');
    });

    // Status indicator
    function updateSidebarStatus() {
        fetch('/api/status')
            .then(r => r.json())
            .then(d => {
                const dot = document.getElementById('statusDot');
                const txt = document.getElementById('statusText');
                if (d.running) {
                    dot.className = 'status-dot online';
                    txt.textContent = 'IDS Running';
                } else {
                    dot.className = 'status-dot offline';
                    txt.textContent = 'IDS Stopped';
                }
            })
            .catch(() => {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Disconnected';
            });
    }
    setInterval(updateSidebarStatus, 3000);
    updateSidebarStatus();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
