{% extends "base.html" %}

{% block title %}Alerts — IDS Dashboard{% endblock %}
{% block page_title %}Alerts{% endblock %}

{% block content %}
<div class="row g-3 mb-3">
    <div class="col-md-4">
        <input type="text" id="alertSearch" class="form-control bg-dark text-light border-secondary"
               placeholder="Search alerts (IP, type, message)…">
    </div>
    <div class="col-md-3">
        <select id="severityFilter" class="form-select bg-dark text-light border-secondary">
            <option value="">All Severities</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
            <option value="INFO">INFO</option>
        </select>
    </div>
    <div class="col-md-3">
        <select id="typeFilter" class="form-select bg-dark text-light border-secondary">
            <option value="">All Types</option>
            <option value="PORT_SCAN">PORT_SCAN</option>
            <option value="BRUTE_FORCE">BRUTE_FORCE</option>
            <option value="SYN_SCAN">SYN_SCAN</option>
            <option value="TRAFFIC_SPIKE">TRAFFIC_SPIKE</option>
            <option value="SUSPICIOUS_PORT">SUSPICIOUS_PORT</option>
            <option value="LARGE_PACKET">LARGE_PACKET</option>
            <option value="SYSTEM">SYSTEM</option>
        </select>
    </div>
    <div class="col-md-2 text-end">
        <button class="btn btn-outline-info w-100" id="refreshAlerts">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover mb-0">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Alert Type</th>
                        <th>Source IP</th>
                        <th>Severity</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="alertsTableBody">
                    <tr><td colspan="5" class="text-center text-muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allAlerts = [];

    function severityBadge(sev) {
        const cls = {HIGH:'danger', MEDIUM:'warning', LOW:'info', INFO:'secondary'}[sev] || 'secondary';
        return `<span class="badge bg-${cls}">${sev}</span>`;
    }

    function renderAlerts(data) {
        const body = document.getElementById('alertsTableBody');
        if (!data.length) {
            body.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No alerts found</td></tr>';
            return;
        }
        body.innerHTML = data.map(a => `
            <tr>
                <td>${a.timestamp}</td>
                <td><code>${a.type}</code></td>
                <td><code>${a.src_ip}</code></td>
                <td>${severityBadge(a.severity)}</td>
                <td>${a.message}</td>
            </tr>
        `).join('');
    }

    function applyFilters() {
        const search = document.getElementById('alertSearch').value.toLowerCase();
        const sev = document.getElementById('severityFilter').value;
        const typ = document.getElementById('typeFilter').value;
        let filtered = allAlerts;
        if (sev) filtered = filtered.filter(a => a.severity === sev);
        if (typ) filtered = filtered.filter(a => a.type === typ);
        if (search) filtered = filtered.filter(a =>
            (a.src_ip && a.src_ip.toLowerCase().includes(search)) ||
            (a.type && a.type.toLowerCase().includes(search)) ||
            (a.message && a.message.toLowerCase().includes(search))
        );
        renderAlerts(filtered);
    }

    function fetchAlerts() {
        fetch('/api/alerts')
            .then(r => r.json())
            .then(data => { allAlerts = data; applyFilters(); });
    }

    document.getElementById('alertSearch').addEventListener('input', applyFilters);
    document.getElementById('severityFilter').addEventListener('change', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);
    document.getElementById('refreshAlerts').addEventListener('click', fetchAlerts);

    fetchAlerts();
    setInterval(fetchAlerts, 5000);
</script>
{% endblock %}
